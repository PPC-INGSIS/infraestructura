name: Deploy

# Despliega el stack en la VM de un entorno: copia stack.yml y <entorno>.env, y corre
# `docker stack deploy` con las versiones (tags) de ese .env.

on:
  workflow_dispatch:
    inputs:
      entorno:
        description: "A qué entorno desplegar"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

# Un solo deploy por entorno a la vez
concurrency:
  group: deploy-${{ inputs.entorno }}
  cancel-in-progress: false

env:
  STACK: snippet-searcher

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # De acá salen SSH_HOST, SSH_USER, SSH_KNOWN_HOSTS y SSH_PRIVATE_KEY
    environment: ${{ inputs.entorno }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar SSH
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ci
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      - name: Copiar archivos a la VM
        env:
          ENTORNO: ${{ inputs.entorno }}
        run: |
          ssh vm 'mkdir -p ~/deploy'
          scp stack.yml "$ENTORNO.env" vm:~/deploy/

      - name: Desplegar y esperar
        env:
          ENTORNO: ${{ inputs.entorno }}
        run: |
          ssh vm bash -s "$ENTORNO" "$STACK" <<'EOF'
          set -euo pipefail
          entorno="$1"
          stack="$2"
          cd ~/deploy

          # Carga los tags del entorno como variables para el deploy
          set -a
          . "./$entorno.env"
          set +a

          docker stack deploy --with-registry-auth -c stack.yml "$stack"

          # Espera hasta 5 minutos a que todos estén en N/N y sin actualizaciones en curso
          for _ in $(seq 1 60); do
            listo=1
            for servicio in $(docker stack services "$stack" --format '{{.Name}}'); do
              estado=$(docker service inspect "$servicio" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')
              case "$estado" in
                ""|completed) ;;
                updating) listo=0 ;;
                *)
                  echo "$servicio: la actualización quedó en '$estado'"
                  docker service ps "$servicio" --no-trunc
                  exit 1
                  ;;
              esac
            done
            if docker stack services "$stack" --format '{{.Replicas}}' | awk -F'[/ ]' '$1 != $2 { exit 1 }'; then
              :
            else
              listo=0
            fi
            if [ "$listo" -eq 1 ]; then
              docker stack services "$stack"
              exit 0
            fi
            sleep 5
          done

          echo "Los servicios no llegaron al estado deseado a tiempo"
          docker stack services "$stack"
          exit 1
          EOF
