name: Deploy

# Despliega el stack en el Swarm de un entorno. El runner le habla al Docker de la VM
# por SSH (docker context) y corre `docker stack deploy` con los tags de versiones.env.
# El login en ghcr.io se hace acá, en el runner: la VM no necesita un docker login manual.
#
# El entorno sale de la rama (gitflow):
# - dev: se despliega solo cuando cambia versiones.env o stack.yml en la rama dev.
# - prod: se despliega solo cuando cambia versiones.env o stack.yml en main, o sea,
#   cuando se mergea dev en main. Ese PR es el release.
# - A mano (workflow_dispatch): prod solo desde main, y dev desde cualquier otra rama.
# Las VMs se prenden a mano (workflow VMs); con la VM apagada este workflow falla en el
# paso "Verificar que la VM responde".

on:
  push:
    branches: [dev, main]
    paths:
      - versiones.env
      - stack.yml
  workflow_dispatch:
    inputs:
      entorno:
        description: "A qué entorno desplegar (prod solo desde main)"
        required: true
        type: choice
        options:
          - dev
          - prod

permissions:
  contents: read

# Un solo deploy por entorno a la vez
concurrency:
  group: deploy-${{ inputs.entorno || (github.ref_name == 'main' && 'prod' || 'dev') }}
  cancel-in-progress: false

env:
  STACK: snippet-searcher
  # En un push, la rama decide el entorno: main es prod y el resto es dev
  ENTORNO: ${{ inputs.entorno || (github.ref_name == 'main' && 'prod' || 'dev') }}

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # De acá salen SSH_HOST, SSH_USER, SSH_KNOWN_HOSTS y SSH_PRIVATE_KEY
    environment: ${{ inputs.entorno || (github.ref_name == 'main' && 'prod' || 'dev') }}
    steps:
      - name: Verificar que la rama corresponde al entorno
        run: |
          if [ "$ENTORNO" = prod ] && [ "$GITHUB_REF_NAME" != main ]; then
            echo "::error::Prod solo se despliega desde main: el release es el PR de dev a main."
            exit 1
          fi
          if [ "$ENTORNO" = dev ] && [ "$GITHUB_REF_NAME" = main ]; then
            echo "::error::main es prod: no se despliega a dev desde main."
            exit 1
          fi

      - name: Checkout
        uses: actions/checkout@v7

      - name: Configurar SSH
        env:
          SSH_HOST: ${{ vars.SSH_HOST }}
          SSH_USER: ${{ vars.SSH_USER }}
          SSH_KNOWN_HOSTS: ${{ vars.SSH_KNOWN_HOSTS }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ci
          chmod 600 ~/.ssh/id_ci
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          cat > ~/.ssh/config <<EOF
          Host vm
            HostName $SSH_HOST
            User $SSH_USER
            IdentityFile ~/.ssh/id_ci
            IdentitiesOnly yes
            StrictHostKeyChecking yes
            BatchMode yes
          EOF

      - name: Verificar que la VM responde
        run: |
          if ! ssh -o ConnectTimeout=20 vm true; then
            echo "::error::La VM no responde por SSH. ¿Está prendida? Prendela con el workflow VMs y volvé a correr este deploy."
            exit 1
          fi

      - name: Crear contexto de Docker hacia la VM
        run: docker context create vm --docker "host=ssh://vm"

      - name: Login en ghcr.io
        env:
          GHCR_USER: ${{ vars.GHCR_USER }}
          GHCR_TOKEN: ${{ secrets.GHCR_TOKEN }}
        run: printf '%s' "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USER" --password-stdin

      - name: Desplegar y esperar
        env:
          # Todos los `docker` de este paso le hablan a la VM, no al Docker del runner
          DOCKER_CONTEXT: vm
        run: |
          set -euo pipefail

          # Carga los tags de esta rama como variables para el deploy
          set -a
          . ./versiones.env
          set +a

          docker stack deploy --with-registry-auth -c stack.yml "$STACK"

          # Espera hasta 5 minutos a que todos estén en N/N y sin actualizaciones en curso
          for _ in $(seq 1 60); do
            listo=1
            for servicio in $(docker stack services "$STACK" --format '{{.Name}}'); do
              estado=$(docker service inspect "$servicio" --format '{{if .UpdateStatus}}{{.UpdateStatus.State}}{{end}}')
              case "$estado" in
                ""|completed) ;;
                updating) listo=0 ;;
                *)
                  echo "$servicio: la actualización quedó en '$estado'"
                  docker service ps "$servicio" --no-trunc
                  exit 1
                  ;;
              esac
            done
            if docker stack services "$STACK" --format '{{.Replicas}}' | awk -F'[/ ]' '$1 != $2 { exit 1 }'; then
              :
            else
              listo=0
            fi
            if [ "$listo" -eq 1 ]; then
              docker stack services "$STACK"
              exit 0
            fi
            sleep 5
          done

          echo "Los servicios no llegaron al estado deseado a tiempo"
          docker stack services "$STACK"
          exit 1

      - name: Estado de las tareas
        env:
          DOCKER_CONTEXT: vm
        run: |
          # Cada tarea con su edad: un servicio que no cambió conserva la edad que tenía,
          # y uno que se actualizó aparece con la tarea nueva y la anterior en Shutdown.
          docker stack ps "$STACK" --no-trunc \
            --format 'table {{.Name}}\t{{.Image}}\t{{.DesiredState}}\t{{.CurrentState}}'
