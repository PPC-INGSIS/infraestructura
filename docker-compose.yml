# Sistema completo de Snippet Searcher.
# Todos los servicios van en este archivo para compartir una misma red de Docker:
# así se encuentran entre ellos por nombre de servicio (ej: http://printscript:8080).
#
# Cada servicio se agrega cuando tenga su imagen disponible.

services:
  permissions:
    image: ghcr.io/ppc-ingsis/permissions-service:${PERMISSIONS_TAG:?falta-definir-PERMISSIONS_TAG-en-el-.env}
    ports:
      - "127.0.0.1:8081:8080" # solo desde esta máquina
    environment:
      SERVER_PORT: 8080
      # La app trae localhost como host de la base: acá se pisa con el nombre del servicio
      SPRING_DATASOURCE_URL: jdbc:postgresql://permissions-db:5432/${PERMISSIONS_DB_NAME:-permissions}
      POSTGRES_USER: ${PERMISSIONS_DB_USER:-permissions}
      POSTGRES_PASSWORD: ${PERMISSIONS_DB_PASSWORD:-permissions}
    depends_on:
      permissions-db:
        condition: service_healthy

  permissions-db:
    image: postgres:18
    ports:
      - "127.0.0.1:5434:5432" # solo desde esta máquina
    environment:
      POSTGRES_DB: ${PERMISSIONS_DB_NAME:-permissions}
      POSTGRES_USER: ${PERMISSIONS_DB_USER:-permissions}
      POSTGRES_PASSWORD: ${PERMISSIONS_DB_PASSWORD:-permissions}
    volumes:
      - permissions-db-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${PERMISSIONS_DB_USER:-permissions} -d ${PERMISSIONS_DB_NAME:-permissions}"]
      interval: 5s
      timeout: 3s
      retries: 10

  printscript:
    image: ghcr.io/ppc-ingsis/printscript-service:${PRINTSCRIPT_TAG:?falta-definir-PRINTSCRIPT_TAG-en-el-.env}
    ports:
      - "127.0.0.1:8082:8080" # solo desde esta máquina
    environment:
      # En desarrollo local (bootRun) escucha en 8082; acá escucha en 8080 como el resto
      SERVER_PORT: 8080

  snippets:
    image: ghcr.io/ppc-ingsis/snippet-service:${SNIPPETS_TAG:?falta-definir-SNIPPETS_TAG-en-el-.env}
    ports:
      - "127.0.0.1:8080:8080" # solo desde esta máquina
    environment:
      # La app trae localhost como host de la base y de PrintScript: acá se pisan con nombres de servicio
      SPRING_DATASOURCE_URL: jdbc:postgresql://snippets-db:5432/${SNIPPETS_DB_NAME:-snippets}
      POSTGRES_USER: ${SNIPPETS_DB_USER:-snippets}
      POSTGRES_PASSWORD: ${SNIPPETS_DB_PASSWORD:-snippets}
      PRINTSCRIPT_URL: http://printscript:8080
    depends_on:
      snippets-db:
        condition: service_healthy
      printscript:
        condition: service_started

  snippets-db:
    image: postgres:18
    ports:
      - "127.0.0.1:5433:5432" # solo desde esta máquina
    environment:
      POSTGRES_DB: ${SNIPPETS_DB_NAME:-snippets}
      POSTGRES_USER: ${SNIPPETS_DB_USER:-snippets}
      POSTGRES_PASSWORD: ${SNIPPETS_DB_PASSWORD:-snippets}
    volumes:
      - snippets-db-data:/var/lib/postgresql
    healthcheck:
      test: [ "CMD-SHELL", "pg_isready -U ${SNIPPETS_DB_USER:-snippets} -d ${SNIPPETS_DB_NAME:-snippets}" ]
      interval: 5s
      timeout: 3s
      retries: 10

  asset-service:
    # La cátedra publica solo `latest`, no hay un tag fijo para elegir
    image: ghcr.io/austral-ingsis/snippet-asset-service:latest
    ports:
      - "127.0.0.1:8083:8080" # solo desde esta máquina
    environment:
      AZURE_HOST: http://azurite
      # El entrypoint carga el agente de New Relic; sin licencia, se apaga
      NEW_RELIC_AGENT_ENABLED: "false"
    depends_on:
      azurite:
        condition: service_started

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite:latest
    volumes:
      - azurite-data:/data

volumes:
  permissions-db-data:
  snippets-db-data:
  azurite-data:

# Plantilla para cada servicio nuevo, siguiendo el de Permisos o el de Snippets:
#   - imagen: ghcr.io/ppc-ingsis/<repo>:${<SERVICIO>_TAG:?...}   (el tag es el SHA del commit)
#   - puerto de la tabla del README, publicado en 127.0.0.1
#   - su base <servicio>-db con healthcheck, y un volumen propio
#   - variables nuevas: agregarlas a .env.example
